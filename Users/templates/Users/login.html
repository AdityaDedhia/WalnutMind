{% extends "layout.html" %}

{% block title %}
<title> User Login | WM</title>
{% endblock title %}

{% block body %}
{% load static %}

<form action = "{% url 'loginn' %}" method = POST>
    {% csrf_token %}

    <section class="vh-100">
      <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-lg-12 col-xl-11">
            <div class="card text-black" style="border-radius: 25px;">
              <div class="card-body p-md-5">
                <div class="row justify-content-center">
                  <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
    
                    <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Welcome back!</p>
    
                    <form class="mx-1 mx-md-4">
    
                      <div class="d-flex flex-row align-items-center mb-4">
                        <i class="bi bi-person-bounding-box fa-lg me-3 fa-fw"></i>
                        <div class="form-outline flex-fill mb-0">
                          <input type="username" class="form-control" name="username" aria-describedby="username">
                          <label class="form-label" for="username">Username</label>
    
                        </div>
                      </div>
    
                      <div class="d-flex flex-row align-items-center mb-4">
                        <i class="bi bi-lock-fill fa-lg me-3 fa-fw"></i>
                        <div class="form-outline flex-fill mb-0">
                          <input type="password" class="form-control" name="password">
                          <label class="form-label">Password</label>

                        </div>
                      </div>

                      <div class="d-flex flex-row align-items-center mb-4">
                        <div class="g-recaptcha" data-sitekey="6LcD15AgAAAAAOSxsqKsuy2iR33_-xq0B5I8WIHv"></div>
                      </div>

                      <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                        <button type="submit" class="btn btn-primary btn-lg">LOG IN</button>
                      </div>
                      <p>Forgot your password? <a href = "{% url 'reset_password' %}">Reset it here</a>.</p>

    
                    </form>
    
                  </div>
                  <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
    
                    <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                      class="img-fluid" alt="Sample image">
    
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    
    
</form>



<script src="https://www.google.com/recaptcha/api.js" async defer></script>


{% endblock body %}
