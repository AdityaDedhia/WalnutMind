{% extends "layout.html" %}

{% block title %}
<title>Publish | WM</title>
{% endblock title %}

{% block body %}

<div class="card text-center">
    <div class="card-header bg-funkpurple">
      <ul class="nav nav-tabs card-header-tabs">
        <li class="nav-item">
          <a class="nav-link active" href="">Publish Article</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'newbookpost' %}">Publish Commentary</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'newblogpost' %}">Publish Blog</a>
        </li>
      </ul>
    </div>
    <div class="card-body form-group">

      <div class="col-lg-10 col-xl-8 offset-lg-1 offset-xl-2">

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.media }}
        
            {{ form.as_p }}
            <button>Publish</button>

        </form>
        
            </div>

    </div>
  </div>

</br>
  
{% endblock body %}
