{% extends "layout.html" %}

{% block title %}
     <title> Articles | WM</title>
{% endblock title %}

{% block body %}
<section class="position-relative pt-0">
<div class="container"
    x-data="{tag: 'All', posts: []}"
    x-init="posts = await (await fetch('/article-list')).json()">

    <ol class="breadcrumb" style="background-color:white">
        <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
        <li class="breadcrumb-item"><a href="">Articles</a></li>
        <li class="breadcrumb-item active" aria-current="page" x-text="tag">
        </li>
    </ol>

    <h3 style="font-family: 'Josefin Sans', sans-serif;">WM <b style="color:gray">Articles</b></h3>
    <hr/>

    <div style="background-color: #d6d6d6; border-radius:15px; padding:10px">
    <button type="button"
    class="btn btn-dark"
    @click = "tag = $el.textContent
    "><b>All</b></button>

    {% for tag in tags %}
    <button style="margin:3px" type="button"
            class="btn btn-light"
            @click="tag = $el.textContent
            ">{{ tag }}</button>
    {% endfor %}
    
    </div>
    <br/>

    <div class="row">
        <div class="col-12">
            <div class="row gy-4">

<template x-for="post in posts.filter(f => tag === 'All' || f.tags.includes(tag))">
       <!-- Card START -->
       <div class="col-sm-6 col-lg-4">
        <div class="card">
            <!-- Card img -->
            <div class="position-relative">
                <img :src = "post.cover" class="card-img" alt="Card image">
                <div class="card-img-overlay d-flex align-items-start flex-column p-3">
                    <!-- Card overlay bottom -->
                    <div class="w-100 mt-auto">
                        <!-- Card category -->
                        <template x-for="tag in post.tags">
                        <span class="badge bg-warning mb-2" style="margin:5px">
                                #<b x-text="tag"></b>
                        </span>
                    </template>

                    </div>
                </div>
            </div>
            <div class="card-body px-0 pt-3">
                <h4 class="card-title"><a :href="'/articles/'+post.slug" class="btn-link text-reset fw-bold"><b x-text="post.title"></b></a></h4>
                <p class="card-text"><i x-text="post.abstract"></i></p>
                <!-- Card info -->
                <ul class="nav nav-divider align-items-center d-none d-sm-inline-block">
                    <li><b x-data="{date: new Date(post.dateCreated)}"  x-text="date.toLocaleString()" class="nav-item" style="color:gray; font-size:12px">Published </b></li>
                </ul>
            </div>
        </div>
    </div>
    <!-- Card END -->
</template>
            </div>
        </div>
    </div>
</div>
</section>

<script>
var id = document.GetElementById("idvalue").innerHTML;
document.write(id);
</script>

<br/>
{% endblock body %}
