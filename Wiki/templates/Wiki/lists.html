{% extends "layout.html" %}

{% block title %}
<title>Wiki | WM</title>
{% endblock title %}

{% block body %}
<ol class="breadcrumb" style = "background-color:white">
    <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
    <li class="breadcrumb-item"><a href="{% url 'wikiindex' %}">Wiki</a></li>
    <li class="breadcrumb-item active" aria-current="page">Lists</li>
</ol>

<div class="col-lg-10 col-xl-8 offset-lg-1 offset-xl-2">

<h1 style="color:gray">Walnut <i>Define</i></h1>
<p>Lists Count: {{ listsCount }}</p>

<ul>
    {% for term in terms %}
    <li>
    <a href = "define-{{ term.slug }}">{{ term.term }}</a>
    </li>
    {% endfor %}
</ul>

</div>
{% endblock body %}
