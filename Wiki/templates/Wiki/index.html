{% extends "layout.html" %}

{% block title %}
<title>Wiki | WM</title>
{% endblock title %}

{% block body %}

    <ol class="breadcrumb" style = "background-color:white">
        <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Wiki</li>
    </ol>

<div class="col-lg-10 col-xl-8 offset-lg-1 offset-xl-2">

  <div class="container-fluid" style = "height: 300px;display: flex;align-items: center;justify-content: center;">
    <form method = POST action = "{% url 'searchterm' %}" class="d-flex">
        {% csrf_token %}

      <input class="form-control me-2" type="search" placeholder="Search anything..." aria-label="Search" name = "searchedterm">

      <button class="btn btn-outline-secondary" type="submit">Search</button>
    </form>
</div>


<div class="row" style = "padding:10px">
  <div class="col btn btn-primary" style = "margin-right:10px; background-image: var(--bs-gradient);">
    <a href = "{% url 'listsview' %}" style="text-align: center"><h1 style = "color:white">BROWSE DEFINITIONS</h1></a>
  </div>

  <div class="col btn btn-primary" style = "background-image: var(--bs-gradient);">
    <a href="{% url 'collectionsview' %}" style="text-align: center"><h1 style="color:white">BROWSE RESOURCES</h1></a>

  </div>
</div>

</div>
{% endblock body %}
