name: Django Tests

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Smoke Tests
        uses: actions/setup-python@v2
        with:
          python-version: 3.7
      - name: Coveralls Python
        uses: AndreMiras/coveralls-python-action@v20201129
      - name: python-flake8
        uses: julianwachholz/flake8-action@v2.0.2
