name: Django CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.8, 3.9]

    steps:
    - name: Cache
      uses: actions/cache@v3.0.5

    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - uses: niden/actions-memcached@v7
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        sudo apt install libmemcached-dev
        pip install -r requirements.txt
    - name: Run Tests
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        ENV_TYPE: ${{ secrets.ENV_TYPE }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_STORAGE_TEST_BUCKET_NAME: ${{ secrets.AWS_STORAGE_TEST_BUCKET_NAME }}
        TESTDBName: ${{ secrets.TESTDBName }}
        TESTDBUser: ${{ secrets.TESTDBUser }}
        TESTDBPass: ${{ secrets.TESTDBPass }}
        TESTDBHost: ${{ secrets.TESTDBHost }}
        CAPTCHA_SECRET: ${{ secrets.captcha_secret }}
        EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}

      run: |
        python manage.py test --keepdb
