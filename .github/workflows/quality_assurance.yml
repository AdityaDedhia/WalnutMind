name: Python Quality Assurance

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Coveralls Check
        uses: AndreMiras/coveralls-python-action@v20201129

  check-quality:
    runs-on: ubuntu-latest
    name: A job to check code quality
    steps:
    - name: Check code meets quality standards
      id: codiga
      uses: codiga/github-action@master
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        codiga_api_token: ${{ secrets.CODIGA_API_TOKEN }}
        force_ref: 'none'
        min_quality_grade: 'EXCELLENT'
        min_quality_score: '95'
        max_defects_rate: '0.002'
        max_complex_functions_rate: '0.05'
        max_long_functions_rate: '0.1'
        project_name: 'WalnutMind'
        max_timeout_sec: '600'
